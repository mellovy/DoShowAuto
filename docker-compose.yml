services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: dsa, POSTGRES_PASSWORD: dsa, POSTGRES_DB: dsa}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["./data:/data"]
    depends_on: [db]
volumes: {pgdata: {}}
